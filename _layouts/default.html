---
layout: compress
---
<!DOCTYPE html>
<html lang="en">
<head>

    {% if site.analytics-google %}
        {% include analytics-google.html %}
    {% endif %}

    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <meta name=author content="{{ site.name }}">

    {% seo %}

    {% include favicon.html %}

    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}{{ "/feed.xml" }}" />

    <style>
    {% capture scss_sheet %}{% include style.scss %}{% endcapture %}
    {{ scss_sheet | scssify }}
    </style>

</head>
<body>

    <div class="theme-toggle-container">
        <a class="theme-toggle-button" id="theme-toggle" href="javascript:void(0);" onclick="modeSwitcher();" aria-label="Toggle dark/light theme">☀</a>
    </div>

    <script>
        function setTheme(theme) {
          try {
            const toggleBtn = document.getElementById("theme-toggle");
            if (theme === "dark") {
              document.documentElement.setAttribute('data-theme', 'dark');
              window.localStorage.setItem('theme', 'dark');
              if (toggleBtn) {
                toggleBtn.textContent = '☾';
                toggleBtn.classList.add('sun');
                toggleBtn.classList.remove('moon');
              }
            } else {
              document.documentElement.setAttribute('data-theme', 'light');
              window.localStorage.setItem('theme', 'light');
              if (toggleBtn) {
                toggleBtn.textContent = '☀';
                toggleBtn.classList.add('moon');
                toggleBtn.classList.remove('sun');
              }
            }
          } catch (error) {
            console.error(error);
          }
        }
    
        let savedTheme = localStorage.getItem('theme');
        if (!savedTheme) {
          savedTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
    
        setTheme(savedTheme);
    
        function modeSwitcher() {
          let currentMode = document.documentElement.getAttribute('data-theme');
    
          if (currentMode === "dark") {
            setTheme('light');
          } else {
            setTheme('dark');
          }
        }
    </script>

    <div class="wrapper-{% if site.width == "normal" %}normal{% elsif site.width == "large" %}large{% endif %}">
        {% if page.tag %}
            <div class="post">
        {% else %}
            {% if showHeader != true %}
                <div class="page {{ page.title | downcase }}">
            {% else %}
                <div class="{{ page.title | downcase }}">
            {% endif %}
        {% endif %}

            {{ content }}
        </div>
    </div>

    {% include icons.html %}

</body>
</html>
